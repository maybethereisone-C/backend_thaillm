name: CI

# Runs automatically on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      # --frozen requires uv.lock to be in sync (it is committed).
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest

  # The Docker image bundles agent_src/, which is intentionally NOT committed
  # (private competition code). A build is therefore only validated where that
  # directory is provided at deploy time, not in public CI.
